<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Station - D</title>
<style>
  :root {
    --bg: #111;
    --panel: #1d1d1d;
    --tile: #262626;
    --text: #f4f4f4;
    --muted: #9a9a9a;
    --next: #ffd23f;
    --done: #3ddc84;
    --warn: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 20px system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.4em 1em;
    padding: 0.6em 1em;
    background: var(--panel);
    font-size: 1.6em;
  }
  #animal { font-weight: 700; }
  #rescan { color: var(--warn); font-size: 0.75em; font-weight: 700; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 1em;
  }
  #prompt-label { color: var(--muted); font-size: 1.4em; text-transform: uppercase; letter-spacing: 0.1em; }
  #prompt { font-size: clamp(2.5em, 11vw, 7em); font-weight: 800; color: var(--next); line-height: 1.1; }
  #prompt.done { color: var(--done); font-size: clamp(2em, 6vw, 4em); }
  #prompt.failed { color: var(--warn); font-size: clamp(2em, 6vw, 4em); }
  #codes { font-size: 2em; margin-top: 0.4em; }
  #codes span { display: inline-block; margin: 0 0.5em; }
  #tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.6em;
    width: 100%;
    max-width: 1400px;
    margin-top: 1.4em;
  }
  .tile {
    background: var(--tile);
    color: var(--muted);
    border-radius: 10px;
    padding: 0.7em;
    min-height: 5.5em;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
  }
  .tile .label { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.06em; }
  .tile .value { font-size: 1.8em; font-weight: 800; }
  .tile.done { background: var(--done); color: #000; }
  .tile.next { background: var(--next); color: #000; box-shadow: 0 0 0 4px var(--text) inset; }
  .tile.failed { background: var(--warn); color: #000; }
  footer { background: var(--panel); padding: 0.5em 1em; overflow-x: auto; }
  footer table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  footer th, footer td { text-align: left; padding: 0.2em 0.5em; border-top: 1px solid #333; white-space: nowrap; }
  footer th { color: var(--muted); font-weight: 600; }
  footer td.flag { color: var(--warn); white-space: normal; }
  footer td.missing { color: var(--warn); font-weight: 700; }
  footer td.yes { color: var(--next); font-weight: 700; }
  #offline { display: none; background: var(--warn); color: #000; text-align: center; padding: 0.4em; font-weight: 700; }
  #offline.show { display: block; }
  .hide-table footer, .hide-flags .flagcol, .hide-hints #codes { display: none; }
</style>
</head>
<body>
<div id="offline">Not connected - this screen may be out of date</div>
<header>
  <div id="animal">-</div>
  <div id="rescan"></div>
</header>
<main>
  <div id="prompt-label"></div>
  <div id="prompt">Scan an animal ID</div>
  <div id="codes"></div>
  <div id="tiles"></div>
</main>
<footer>
  <table><thead id="recent-head"></thead><tbody id="recent"></tbody></table>
</footer>
<script>
const $ = id => document.getElementById(id);

// Parts /live can switch off, e.g. ?hide=table,hints,flags
const HIDE = new Set((new URLSearchParams(location.search).get('hide') || '').split(','));
HIDE.forEach(part => { if (part) document.body.classList.add(`hide-${part}`); });

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function formatAnswer(answer) {
  if (answer === true) return 'Yes';
  if (answer === false) return 'No';
  return answer ?? '';
}

// A step that doesn't apply to the species has no key and stays blank;
// one that applies but wasn't scanned shows "?".
function answerCell(animal, step) {
  if (!(step in animal.answers)) return el('td', 'na', '');
  const answer = animal.answers[step];
  if (answer === null) return el('td', 'missing', '?');
  return el('td', answer === true ? 'yes' : '', formatAnswer(answer));
}

function renderHead(head, steps) {
  const row = el('tr');
  ['#', 'Animal', 'Weight', ...steps.map(s => s.label), 'Flags'].forEach(label => {
    row.appendChild(el('th', label === 'Flags' ? 'flagcol' : '', label));
  });
  head.replaceChildren(row);
}

function animalRow(a, steps) {
  const row = el('tr');
  row.appendChild(el('td', '', a.order));
  row.appendChild(el('td', '', a.animal_id));
  row.appendChild(el('td', '', a.weight !== null ? `${Math.round(a.weight)} lb` : '-'));
  steps.forEach(s => row.appendChild(answerCell(a, s.step)));
  row.appendChild(el('td', a.qa.length ? 'flag flagcol' : 'flagcol', a.qa.join('; ')));
  return row;
}

function tile(label, value, state) {
  const node = el('div', `tile ${state}`);
  node.appendChild(el('div', 'label', label));
  node.appendChild(el('div', 'value', value));
  return node;
}

function render(status) {
  const current = status.current;
  const prompt = $('prompt');
  const tiles = $('tiles');
  $('codes').replaceChildren();
  tiles.replaceChildren();
  $('rescan').textContent = '';
  $('prompt-label').textContent = '';
  prompt.className = '';

  if (!current) {
    $('animal').textContent = '-';
    prompt.textContent = 'Scan an animal ID';
  } else {
    $('animal').textContent = `#${current.order}  ${current.animal_id}  ${current.species}`;

    if (current.entries > 1) {
      $('rescan').textContent = `Rescan: entry ${current.entry} of ${current.entries}`;
    }

    // The weight comes first, as its own tile.
    if (current.weight !== null) {
      tiles.appendChild(tile('Weight', `${Math.round(current.weight)} lb`, 'done'));
    } else if (current.weight_failed) {
      tiles.appendChild(tile('Weight', 'Rescan ID', 'failed'));
    } else {
      tiles.appendChild(tile('Weight', 'Waiting...', ''));
    }

    current.steps.forEach(s => {
      if (s.answer !== null) {
        tiles.appendChild(tile(s.label, formatAnswer(s.answer), 'done'));
      } else if (s.step === current.next_step) {
        tiles.appendChild(tile(s.label, 'Scan', 'next'));
      } else {
        tiles.appendChild(tile(s.label, '-', ''));
      }
    });

    const next = current.steps.find(s => s.step === current.next_step);

    if (next) {
      $('prompt-label').textContent = 'Scan next';
      prompt.textContent = next.label;
      next.codes.forEach(c => {
        const label = typeof c.value === 'boolean' ? c.code : `${c.code} ${c.value}`;
        $('codes').appendChild(el('span', '', label));
      });
    } else if (current.weight !== null) {
      prompt.className = 'done';
      prompt.textContent = 'Done - scan the next animal';
    } else if (current.weight_failed) {
      prompt.className = 'failed';
      prompt.textContent = 'No valid weight - rescan ID';
    } else {
      prompt.className = 'done';
      prompt.textContent = 'Scans done - waiting for weight';
    }
  }

  renderHead($('recent-head'), status.steps);
  const recent = $('recent');
  recent.replaceChildren();
  status.animals.slice(-5).reverse().forEach(a => {
    recent.appendChild(animalRow(a, status.steps));
  });
}

function refresh() {
  fetch('/live_status')
    .then(response => response.json())
    .then(status => {
      $('offline').className = '';
      render(status);
    })
    .catch(() => { $('offline').className = 'show'; });
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
