[project]
name = "slaughter-measurements"
version = "0.1.0"
description = "Capture and share slaughter-floor barcode and weight measurements."
readme = "README.md"
authors = [
    { name = "thisoldfarminc", email = "tech@thisoldfarminc.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
